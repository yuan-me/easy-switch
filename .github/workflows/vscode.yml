name: VS Code Extension
on:
  workflow_dispatch:
  push:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - extensions/vscode/**
      - .github/workflows/vscode.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - extensions/vscode/**
      - .github/workflows/vscode.yml
permissions:
  contents: read
jobs:
  linux-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: vscode-${{ matrix.arch }}
      - name: Install native musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Run Linux portability and helper regression tests
        run: |
          cargo test -p easy-switch-core --test remote_core --locked
          cargo test -p easy-switch-helper --locked
      - name: Build static helper
        run: env "CC_${{ matrix.target }}=musl-gcc" cargo build -p easy-switch-helper --release --target ${{ matrix.target }} --locked
      - uses: actions/upload-artifact@v4
        with:
          name: helper-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/easy-switch-helper
          if-no-files-found: error
  package:
    needs: linux-helper
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: helper-linux-x64
          path: extensions/vscode/bin/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: helper-linux-arm64
          path: extensions/vscode/bin/linux-arm64
      - run: npm ci
      - run: npm test
      - run: node --test scripts/package.test.mjs
      - run: python3 scripts/qemu-test.py --self-test
      - run: python3 -B scripts/proc-audit.test.py
      - run: sh -n scripts/install-proc-audit.sh
      - name: Package and audit both Linux helpers
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: easy-switch-vscode
          path: |
            extensions/vscode/dist/*.vsix
            extensions/vscode/dist/*.vsix.json
          if-no-files-found: error
